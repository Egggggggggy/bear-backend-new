[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-companion"
version = "0.1.0"
description = "Asynchronous multimodal healthcare companion runtime for Jetson Orin Nano"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
jetson = [
    "sounddevice",
    "picamera2",
    "opencv-python",
    "onnxruntime-gpu",
    "torch",
    "torchaudio",
    "mediapipe",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

